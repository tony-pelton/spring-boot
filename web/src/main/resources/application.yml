#debug: true
logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
  level:
    root: INFO
    web: DEBUG
    sql: DEBUG
    tomcat: DEBUG
spring:
  data:
    rest:
      base-path: /api
  jpa:
    hibernate:
#      ddl-auto: create-drop
      ddl-auto: update
  datasource:
    url: jdbc:h2:tcp://localhost/mem:web
  application:
    name: web
management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"