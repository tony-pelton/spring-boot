<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.5/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4 text-center">Login</h2>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
    <label for="username" class="form-label">Email</label>
    <select class="form-select" id="username" name="username" required autofocus
            onchange="document.getElementById('password').value='password'">
        <option value="" disabled selected>Select a user...</option>
        <option th:each="email : ${emails}" th:value="${email}" th:text="${email}"></option>
    </select>
</div>
<div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control" id="password" name="password" required value="password">
</div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success mt-3" role="alert">
            You have been logged out.
        </div>
    </form>
</div>
</body>
</html>
