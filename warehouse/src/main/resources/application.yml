#debug: true
server:
  port: 8090
logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
  level:
    root: INFO
    web: DEBUG
    sql: DEBUG
    tomcat: DEBUG
spring:
  data:
    rest:
      base-path: /api
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:tcp://localhost/mem:warehouse
  application:
    name: warehouse
management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"